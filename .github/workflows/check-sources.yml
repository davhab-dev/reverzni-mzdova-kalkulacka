name: Kontrola oficiálních zdrojů

on:
  push:
    paths:
      - 'scripts/check_sources.py'
      - '.github/workflows/check-sources.yml'
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kontrola-oficialnich-zdroju
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Načti repozitář
        uses: actions/checkout@v4

      - name: Nastav Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstaluj nástroj pro čtení PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Ověř syntaxi kontrolního skriptu
        run: python -m py_compile scripts/check_sources.py

      - name: Zkontroluj oficiální zdroje
        run: python scripts/check_sources.py

      - name: Ulož výsledek kontroly
        run: |
          if [[ -n "$(git status --porcelain status.json source_snapshot.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status.json source_snapshot.json
            git commit -m "Aktualizuj stav kontroly oficiálních zdrojů"
            git push
          fi
